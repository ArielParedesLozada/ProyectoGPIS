server {
    listen 80;
    server_name localhost;

    # Carpeta pública de Laravel dentro del contenedor
    root /var/www/html/public;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Mejorar manejo de errores
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    location ~ \.php$ {
        # Separa script y PATH_INFO
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass php83_app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        # OJO: ruta del index.php tal como existe en php83_app
        # Usar la ruta completa del documento root + script name
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        
        # Timeouts para evitar errores
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        
        # Evitar pasar requests a PHP-FPM si el archivo no existe
        fastcgi_intercept_errors off;
    }

    location ~ /\.ht {
        deny all;
    }
}
