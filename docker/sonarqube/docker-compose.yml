services:
  sonarqube:
    image: sonarqube:25.9.0.112764-community
    hostname: sonarqube
    container_name: sonarqube_laravel
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar #admin
      SONAR_JDBC_PASSWORD: sonar #Sonarqube_SQL_2
#    volumes:
#      - ./sonarqube/sonarqube_data:/opt/sonarqube/data #Cambia direccion de montaje, si quieres
#      - ./sonarqube/sonarqube_extensions:/opt/sonarqube/extensions #Cambia direccion de montaje, si quieres
#      - ./sonarqube/sonarqube_logs:/opt/sonarqube/logs #Cambia direccion de montaje, si quieres
    ports:
      - "9000:9000"
    networks:
      - sonarnet
  db:
    image: postgres:17
    hostname: postgresql
    restart: unless-stopped
    container_name: sonarqube_db_laravel
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
#    volumes:
#      - ./sonarqube/postgresql:/var/lib/postgresql
    ports:
      - "9432:5432"
    networks:
      - sonarnet
volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:

networks:
  sonarnet: