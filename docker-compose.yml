services:
  postgis:
    container_name: postgis
    image: postgis/postgis:17-master
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: clave_piola
    volumes:
      - ~/.docker/postgis:/var/lib/postgresql
    networks: [app_net]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_postgis
    restart: unless-stopped
    ports:
      - "8433:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: grupophpasw@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Sihaya123
    depends_on: [postgis]
    networks: [app_net]

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: php83_app
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
    working_dir: /var/www/html
    depends_on: [postgis]
    networks: [app_net]

  web:
    image: nginx:alpine
    container_name: nginx_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [app_net]

networks:
  app_net:
