services:
  postgis:
    container_name: postgis
    image: postgis/postgis:17-master
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: clave_piola
      POSTGRES_DB: postgres
    volumes:
      - ~/.docker/postgis:/var/lib/postgresql
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_postgis
    restart: unless-stopped
    ports:
      - "8433:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: grupophpasw@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Sihaya123
    depends_on:
      - postgis
    networks: [app_net]

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: php83_app
    # ❌ QUITAMOS el volumen del código
    volumes:
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      # Compartir los assets compilados con Nginx
      - app_build:/var/www/html/public/build
    working_dir: /var/www/html
    # Copiar assets, ejecutar migraciones y luego iniciar PHP-FPM
    command: sh -c "/usr/local/bin/init-assets.sh && php artisan migrate --force --no-interaction || true && docker-php-entrypoint php-fpm"
    depends_on:
      postgis:
        condition: service_healthy
    networks: [app_net]
    # Exponer el puerto de PHP-FPM para debugging (opcional)
    expose:
      - "9000"

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: nginx_app
    ports:
      - "8080:80"
    depends_on:
      - app
    networks: [app_net]
    # Compartir los assets compilados desde PHP
    volumes:
      - app_build:/var/www/html/public/build:ro
    restart: unless-stopped

networks:
  app_net:
    driver: bridge

volumes:
  app_build:
    driver: local
