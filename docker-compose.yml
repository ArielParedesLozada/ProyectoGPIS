version: "3.9"

services:
  postgis:
    container_name: postgis
    image: postgis/postgis:17-master
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: clave_piola
    volumes:
      - postgis_data:/var/lib/postgresql/data
    networks: [app_net]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_postgis
    restart: unless-stopped
    ports:
      - "8433:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: grupophpasw@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Sihaya123
    depends_on: [postgis]
    networks: [app_net]

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: php83_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:delegated
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
    depends_on: [postgis]
    networks: [app_net]

  web:
    image: nginx:alpine
    container_name: nginx_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [app_net]

  vite:
    image: node:20-alpine
    container_name: vite_dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:delegated
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on: [app]
    networks: [app_net]

networks:
  app_net:

volumes:
  vendor:
  node_modules:
  postgis_data:
