services:
  postgis:
    container_name: databasegpis
    image: postgis/postgis:17-master
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: clave_piola
      POSTGRES_DB: postgres
    volumes:
      - ~/Documentos/Academico/Sexto_Semestre/Pruebas/volumes/postgis:/var/lib/postgresql
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: php83_app
    
    volumes:
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      - app_build:/var/www/html/public/build
      # 🔹 storage compartido con nginx
      - app_storage:/var/www/html/storage
    working_dir: /var/www/html
    
    environment:
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    
    command: >
      sh -c "
        /usr/local/bin/init-assets.sh &&
        /usr/local/bin/update-mail-password.sh &&
        php artisan migrate --force --no-interaction --seed &&
        docker-php-entrypoint php-fpm
      "
    depends_on:
      postgis:
        condition: service_healthy
    networks: [app_net]
    
    expose:
      - "9000"

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: nginx_app
    ports:
      - "8080:80"
    depends_on:
      - app
    networks: [app_net]
    
    volumes:
      - app_build:/var/www/html/public/build:ro
      # 🔹 mismo storage que el PHP (solo lectura)
      - app_storage:/var/www/html/storage:ro
    restart: unless-stopped

networks:
  app_net:
    driver: bridge

volumes:
  app_build:
    driver: local
  app_storage:
    driver: local
